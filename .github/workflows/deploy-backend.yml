name: Deploy backend

on:
  push:
    branches: [master]
    paths:
      - "backend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name documindregistry

      - name: Build and push image
        run: |
          docker build --platform linux/amd64 \
            -t documindregistry.azurecr.io/documind-backend:latest \
            backend
          docker push documindregistry.azurecr.io/documind-backend:latest

      - name: Update Container App
        run: |
          az containerapp update \
            --name documind-api \
            --resource-group documind-rg \
            --image documindregistry.azurecr.io/documind-backend:latest
